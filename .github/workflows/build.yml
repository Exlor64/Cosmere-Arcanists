name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - name: Run required server GameTests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon | tee gametest.log
          python -c 'import re; assert re.search(r"All [1-9][0-9]* required tests passed", open("gametest.log").read()), "Server did not report completed required GameTests"'
      - uses: actions/upload-artifact@v4
        with:
          name: Cosmere-Arcanists
          path: build/libs/*.jar
